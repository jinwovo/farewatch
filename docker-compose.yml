name: farewatch

services:
  postgres:
    image: postgres:16-alpine
    container_name: fw-postgres
    environment:
      POSTGRES_DB: farewatch
      POSTGRES_USER: farewatch
      POSTGRES_PASSWORD: farewatch
    ports:
      - "5435:5432"          # host 5435 (registry-allocated) -> container 5432
    volumes:
      - fw-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farewatch -d farewatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fw-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6381:6379"          # host 6381 (registry-allocated) -> container 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- observability -----------------------------------------------------------------
  # The backend runs on the HOST (run.ps1 / java -jar), so Prometheus scrapes it through
  # host.docker.internal (extra_hosts). Grafana auto-provisions the datasource + the
  # farewatch dashboard and runs anonymous read-only — open http://localhost:3004, no login.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fw-prometheus
    ports:
      - "9096:9090"          # host 9096 -> 9090 (registry reserved 9092, moved off the Kafka clash)
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: fw-grafana
    ports:
      - "3004:3000"          # host 3004 (registry-allocated) -> container 3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

volumes:
  fw-pgdata:
